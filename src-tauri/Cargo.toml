[package]
name = "system-maintenance-toolkit"
version = "2.0.0"
description = "Cross-platform desktop application for routine macOS and Windows maintenance."
authors = ["lzdrahal"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "system_maintenance_toolkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "fs", "rt", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
